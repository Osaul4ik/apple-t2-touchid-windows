name: CI T2TouchIdBio (SepVaultGui + T2SepBootstrap)

# T2TouchIdBio (driver/T2TouchIdBio) is not part of T2TouchId.sln yet and has
# two independent pieces at very different states of readiness:
#
#   - SepVaultGui (Sepvaultgui.csproj): a real, buildable .NET 8 WPF project.
#     Built and published like any other project in this job.
#
#   - T2SepBootstrapService.cpp: per driver/T2TouchIdBio/docs/Readme.MD, this
#     has deliberately NOT had a .vcxproj added yet ("простіше створити його
#     в IDE... ніж відтворювати GUID/toolset-специфічний XML вручну"). So
#     there is nothing for MSBuild to build here. Rather than either skip it
#     silently or hand-roll a project file the repo explicitly says to create
#     in the IDE, this workflow does a compile-only sanity check (cl.exe /c,
#     no link) against its real include paths (SepVaultFormat.h,
#     ../../protocol/AppleKeyStore/Client.h) - enough to catch syntax/type
#     errors on every push, without inventing build infrastructure that
#     belongs in its own PR.
#
# Same conventions as Cit2touchid.yml / BuildT2TouchId.yml: windows-2022,
# own concurrency group, path-scoped triggers so this doesn't run (or
# collide) on changes unrelated to T2TouchIdBio.

on:
  push:
    branches: [ main ]
    paths:
      - 'driver/T2TouchIdBio/**'
      - 'protocol/AppleKeyStore/**'
      - 'driver/T2TouchIdTransport/public.h'
      - '.github/workflows/CiT2TouchIdBio.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'driver/T2TouchIdBio/**'
      - 'protocol/AppleKeyStore/**'
      - 'driver/T2TouchIdTransport/public.h'
      - '.github/workflows/CiT2TouchIdBio.yml'
  workflow_dispatch:

concurrency:
  group: ci-t2touchidbio-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  BIO_DIR: driver/T2TouchIdBio
  GUI_PROJECT: driver/T2TouchIdBio/Sepvaultgui.csproj
  GUI_ASSEMBLY_NAME: SepVaultGui
  BOOTSTRAP_SRC: driver/T2TouchIdBio/T2SepBootstrapService.cpp
  DOTNET_VERSION: '8.0.x'
  CONFIGURATION: Release
  PLATFORM: x64

jobs:
  ci:
    name: Build SepVaultGui + compile-check T2SepBootstrapService
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v4

    # =========================================================================
    # SepVaultGui: net8.0-windows / UseWPF, plain SDK-style csproj, not in
    # T2TouchId.sln. Built standalone with the .NET SDK rather than MSBuild -
    # same reasoning as the other projects using "locate the right tool for
    # what's actually there" instead of assuming everything goes through the
    # one build entry point.
    # =========================================================================
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore SepVaultGui
      run: dotnet restore "$env:GUI_PROJECT"
      shell: pwsh

    - name: Build SepVaultGui
      run: |
        dotnet build "$env:GUI_PROJECT" `
          --no-restore `
          -c $env:CONFIGURATION
      shell: pwsh

    # =========================================================================
    # Publish a self-contained win-x64 output so the uploaded artifact is
    # something that actually runs on a target machine without a .NET 8
    # runtime install, matching how the driver/tool packages from the other
    # T2TouchId workflows are meant to be dropped onto real hardware.
    # =========================================================================
    - name: Publish SepVaultGui (self-contained win-x64)
      run: |
        $ErrorActionPreference = "Stop"
        dotnet publish "$env:GUI_PROJECT" `
          -c $env:CONFIGURATION `
          -r win-x64 `
          --self-contained true `
          -p:PublishSingleFile=true `
          -o artifacts\SepVaultGui

        $exePath = "artifacts\SepVaultGui\$env:GUI_ASSEMBLY_NAME.exe"
        if (-not (Test-Path $exePath)) {
          Write-Error "Expected published binary not found: $exePath"
          exit 1
        }
        Write-Host "OK: published $exePath"
      shell: pwsh

    # =========================================================================
    # T2SepBootstrapService.cpp has no .vcxproj yet (see the block comment at
    # the top of this file / driver/T2TouchIdBio/docs/Readme.MD). Compile
    # only (no link, no protocol.lib, no vcpkg/libplist) against its real
    # relative includes - SepVaultFormat.h next to it, and
    # ../../protocol/AppleKeyStore/Client.h, which MSVC resolves relative to
    # T2SepBootstrapService.cpp's own directory for quoted includes, so no
    # extra /I is needed. This is deliberately narrower than a full build:
    # it exists to catch syntax/type errors on every push, not to produce
    # T2SepBootstrap.exe. Same warning level/standard as the rest of this
    # repo's user-mode C++ (protocol/T2TouchIdProtocol.vcxproj: /W4 /WX,
    # stdcpp17).
    # =========================================================================
    - name: Setup MSVC (cl.exe) x64
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Compile-check T2SepBootstrapService.cpp
      run: |
        $ErrorActionPreference = "Stop"
        $objDir = "artifacts\T2SepBootstrapService-check"
        New-Item -ItemType Directory -Path $objDir -Force | Out-Null

        cl.exe /nologo /c /W4 /WX /EHsc /std:c++17 `
          /Fo"$objDir\" `
          "$env:BOOTSTRAP_SRC"

        if ($LASTEXITCODE -ne 0) {
          Write-Error "T2SepBootstrapService.cpp failed to compile (exit code $LASTEXITCODE)."
          exit 1
        }
        Write-Host "OK: T2SepBootstrapService.cpp compiles clean (compile-only, not linked - no .vcxproj yet)."
      shell: pwsh

    - name: Upload SepVaultGui package
      uses: actions/upload-artifact@v4
      with:
        name: SepVaultGui-${{ github.sha }}
        path: artifacts/SepVaultGui
        if-no-files-found: error