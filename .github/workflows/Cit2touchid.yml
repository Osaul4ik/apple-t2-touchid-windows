name: CI T2TouchId (CodeQL + PREfast + StaticAnalysis + Build)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ci-t2touchid-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  SOLUTION: T2TouchId.sln
  DRIVER_DIR: driver/T2TouchIdTransport
  DRIVER_PROJECT: driver/T2TouchIdTransport/T2TouchIdTransport.vcxproj
  DRIVER_NAME: T2TouchIdTransport
  CONFIGURATION: Release
  PLATFORM: x64
  SIGN_CERT_PFX: ${{ secrets.CERT }}
  SIGN_CERT_PASSWORD: ${{ secrets.CERT_PWD }}
  # T2SepBootstrap (Win32 service) and T2SepCoInstaller (its PnP co-installer
  # DLL, see [T2TouchIdTransport_Device.NT.CoInstallers] in the INF) are both
  # v143 projects already in T2TouchId.sln, so "Build full solution" below
  # produces them for free - only SepVaultGui (a standalone .NET/WPF project,
  # not in the .sln) needs its own dotnet steps.
  BOOTSTRAP_PROJECT: T2SepBootstrap
  COINSTALLER_NAME: T2SepCoInstaller
  GUI_PROJECT: driver/T2TouchIdBio/Sepvaultgui.csproj
  GUI_ASSEMBLY_NAME: SepVaultGui
  DOTNET_VERSION: '8.0.x'

# ===========================================================================
# Той самий принцип, що й у CI (CodeQL + StaticAnalysis + Build) для
# AmtPtpDeviceUsbKm: один job, один раннер. CodeQL трасує саме той msbuild-
# виклик, що будує T2TouchIdTransport.vcxproj (PREfast-прапори всередині
# цього виклику), потім mustrun/mustfix аналіз бази - і лише якщо mustfix
# чистий, job іде далі: білдиться решта солюшна (protocol/tools/tests,
# яким потрібен vcpkg/libplist), ганяються тести, і той самий .sys що вже
# лежить на диску - стемпається/підписується й пакується разом із SARIF-
# звітами. Ніякого окремого білда "на підпис" - той самий бінарник.
# ===========================================================================
jobs:
  ci:
    name: CodeQL + PREfast + StaticAnalysis + Build + Package
    runs-on: windows-2022
    timeout-minutes: 75
    permissions:
      contents: read
      security-events: write
    env:
      CODEQL_CLI_VERSION: 2.24.1
      CODEQL_DRIVERS_PACK_VERSION: 1.8.2
      CODEQL_CPP_QUERIES_PACK_VERSION: 0.0.4
      CA_TREAT_WARNINGS_AS_ERRORS: true

    steps:
    - uses: actions/checkout@v4

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    # =====================================================================
    # Official WDK installer - same fwlink/flow as the reference driver's
    # CI. Avoids the choco windowsdriverkit11 package's missing x86
    # InfVerif.dll gap that MSBuild's automatic INF-verification step
    # needs.
    # =====================================================================
    - name: Install WDK
      run: |
        $ErrorActionPreference = "Stop"
        $wdkUrl = "https://go.microsoft.com/fwlink/?linkid=2085767"
        $wdkInstaller = "$env:TEMP\wdksetup.exe"
        Invoke-WebRequest -Uri $wdkUrl -OutFile $wdkInstaller
        $proc = Start-Process -FilePath $wdkInstaller -ArgumentList "/quiet /norestart" -Wait -PassThru
        $exitCode = $proc.ExitCode
        if ($exitCode -ne 0 -and $exitCode -ne 3010) {
          Write-Error "WDK installer exited with code $exitCode"
          exit 1
        }
        Write-Host "OK: WDK installer exited with code $exitCode"
      shell: pwsh

    - name: Verify WDK installation
      run: |
        $ErrorActionPreference = "Stop"
        $roots = @(
          "C:\Program Files (x86)\Windows Kits\10\bin",
          "C:\Program Files\Windows Kits\10\bin"
        )
        $stampinf = foreach ($root in $roots) {
          if (Test-Path $root) {
            Get-ChildItem -Path $root -Filter "StampInf.exe" -Recurse -ErrorAction SilentlyContinue
          }
        }
        if (-not $stampinf) {
          Write-Error "WDK build tooling (StampInf.exe) not found anywhere under Windows Kits 10\bin after install."
          exit 1
        }
        Write-Host "OK: found WDK build tooling, e.g. $($stampinf[0].FullName)"
      shell: pwsh

    # =====================================================================
    # protocol/tools/tests are user-mode and need libplist
    # (protocol/BridgeXpc/PlistPayload.cpp). Only classic-mode consumers
    # (this repo builds via plain MSBuild, not CMake) need the actual .lib
    # filename vcpkg produced, so it's discovered rather than guessed -
    # same "locate, don't assume" pattern used for StampInf/Inf2Cat/
    # signtool below. This step is only needed for the full-solution build
    # after the driver-only CodeQL/PREfast pass; the driver project itself
    # does not depend on vcpkg.
    # =====================================================================
    - name: Bootstrap vcpkg
      run: |
        $ErrorActionPreference = "Stop"
        git clone --depth 1 https://github.com/microsoft/vcpkg.git vcpkg
        .\vcpkg\bootstrap-vcpkg.bat -disableMetrics
      shell: pwsh

    - name: Install libplist (vcpkg)
      run: |
        $ErrorActionPreference = "Stop"
        .\vcpkg\vcpkg.exe install libplist:x64-windows
      shell: pwsh

    - name: Locate libplist library file
      run: |
        $ErrorActionPreference = "Stop"
        $libDir = "vcpkg\installed\x64-windows\lib"
        $lib = Get-ChildItem -Path $libDir -Filter "*.lib" |
          Where-Object { $_.Name -match "plist" -and $_.Name -notmatch "\+\+" } |
          Select-Object -First 1

        if (-not $lib) {
          Write-Error "No plist .lib found under $libDir after vcpkg install."
          exit 1
        }

        Write-Host "OK: found $($lib.Name)"
        Add-Content -Path $env:GITHUB_ENV -Value "PLIST_LIB_NAME=$($lib.Name)"
        Add-Content -Path $env:GITHUB_ENV -Value "VCPKG_INSTALLED_DIR=$PWD\vcpkg\installed\x64-windows"
      shell: pwsh

    - name: Download CodeQL CLI
      run: |
        $ErrorActionPreference = "Stop"
        $url = "https://github.com/github/codeql-cli-binaries/releases/download/v$env:CODEQL_CLI_VERSION/codeql-win64.zip"
        Invoke-WebRequest -Uri $url -OutFile "$env:TEMP\codeql.zip"
        Expand-Archive -Path "$env:TEMP\codeql.zip" -DestinationPath "$env:TEMP\codeql-home" -Force
        $codeqlExe = Get-ChildItem -Path "$env:TEMP\codeql-home" -Filter "codeql.exe" -Recurse | Select-Object -First 1
        if (-not $codeqlExe) {
          Write-Error "codeql.exe not found after extraction."
          exit 1
        }
        Add-Content -Path $env:GITHUB_ENV -Value "CODEQL_DIR=$($codeqlExe.DirectoryName)"
      shell: pwsh

    - name: Verify CodeQL install
      run: |
        & "$env:CODEQL_DIR\codeql.exe" --version
      shell: pwsh

    - name: Download windows-drivers query pack
      run: |
        $ErrorActionPreference = "Stop"
        & "$env:CODEQL_DIR\codeql.exe" pack download "microsoft/windows-drivers@$env:CODEQL_DRIVERS_PACK_VERSION"
      shell: pwsh

    - name: Download cpp-queries dependency pack
      run: |
        $ErrorActionPreference = "Stop"
        & "$env:CODEQL_DIR\codeql.exe" pack download "microsoft/cpp-queries@$env:CODEQL_CPP_QUERIES_PACK_VERSION"
      shell: pwsh

    # =====================================================================
    # Same version/date scheme as the reference project, computed once so
    # it stays identical between the INF stamp later and any artifact
    # naming.
    # =====================================================================
    - name: Compute driver version and date
      id: setver
      run: |
        $ErrorActionPreference = "Stop"
        $now = Get-Date

        $driverDate    = $now.ToString("MM/dd/yyyy")
        $driverVersion = "1.$($now.Year).$($now.ToString('MMdd')).$($now.ToString('HHmm'))"

        Write-Host "==> Driver date (DriverVer date): $driverDate"
        Write-Host "==> Driver version (DriverVer ver): $driverVersion"

        Add-Content -Path $env:GITHUB_ENV -Value "DRIVER_DATE=$driverDate"
        Add-Content -Path $env:GITHUB_ENV -Value "DRIVER_VERSION=$driverVersion"
        Add-Content -Path $env:GITHUB_OUTPUT -Value "version=$driverVersion"
      shell: pwsh

    # =====================================================================
    # Single compile that CodeQL traces: only T2TouchIdTransport.vcxproj
    # (the actual PCI\VEN_106B&DEV_1802 KMDF driver), same as the
    # reference project's driver-only CodeQL pass. mustrun/mustfix.qls
    # (windows-driver-suites) are driver-specific query suites, so scoping
    # the traced build to the driver project - not the whole solution -
    # keeps the WHCP-relevant signal from being diluted by unrelated
    # user-mode protocol/tool/test code. KMDF_VERSION_MAJOR/MINOR (1.15)
    # are already pinned inside the vcxproj; only the WDK target platform
    # version needs to be pinned here, to whatever this runner's WDK
    # installer actually shipped.
    # =====================================================================
    - name: Build CodeQL database (with PREfast /analyze baked in)
      run: |
        $ErrorActionPreference = "Stop"
        $dbPath  = "$env:TEMP\codeql-db"
        $logDir  = Join-Path $env:GITHUB_WORKSPACE "static-analysis-logs"
        New-Item -ItemType Directory -Path $logDir -Force | Out-Null
        $buildLog = Join-Path $logDir "build.log"

        $buildCmd = "msbuild /p:Configuration=$env:CONFIGURATION /p:Platform=$env:PLATFORM " +
                    "/p:WindowsTargetPlatformVersion=10.0.26100.0 " +
                    "/p:RunCodeAnalysis=true /p:EnableCppCoreCheck=true " +
                    "/p:CodeAnalysisTreatWarningsAsErrors=$env:CA_TREAT_WARNINGS_AS_ERRORS " +
                    "/nologo /verbosity:normal /clp:Summary " +
                    "/flp:logfile=$buildLog;verbosity=normal " +
                    "$env:DRIVER_PROJECT /t:rebuild"

        & "$env:CODEQL_DIR\codeql.exe" database create $dbPath `
          --language=cpp `
          --source-root=. `
          --command=$buildCmd

        Add-Content -Path $env:GITHUB_ENV -Value "CODEQL_DB=$dbPath"
        Add-Content -Path $env:GITHUB_ENV -Value "BUILD_LOG_DIR=$logDir"
      shell: pwsh

    - name: Upload build logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: static-analysis-logs
        retention-days: 14
        if-no-files-found: warn
        path: static-analysis-logs/

    - name: Analyze with mustrun.qls (informational)
      run: |
        $ErrorActionPreference = "Stop"
        & "$env:CODEQL_DIR\codeql.exe" database analyze "$env:CODEQL_DB" `
          "microsoft/windows-drivers:windows-driver-suites/mustrun.qls" `
          --format=sarifv2.1.0 `
          --output="$env:TEMP\codeql-mustrun.sarif"
        Add-Content -Path $env:GITHUB_ENV -Value "SARIF_MUSTRUN=$env:TEMP\codeql-mustrun.sarif"
      shell: pwsh

    - name: Analyze with mustfix.qls (blocking)
      run: |
        $ErrorActionPreference = "Stop"
        $sarifPath = "$env:TEMP\codeql-mustfix.sarif"

        & "$env:CODEQL_DIR\codeql.exe" database analyze "$env:CODEQL_DB" `
          "microsoft/windows-drivers:windows-driver-suites/mustfix.qls" `
          --format=sarifv2.1.0 `
          --output=$sarifPath

        Add-Content -Path $env:GITHUB_ENV -Value "SARIF_MUSTFIX=$sarifPath"

        $sarif = Get-Content -Path $sarifPath -Raw | ConvertFrom-Json
        $resultCount = 0
        foreach ($run in $sarif.runs) {
          if ($run.results) { $resultCount += $run.results.Count }
        }
        Write-Host "==> mustfix.qls results: $resultCount"

        if ($resultCount -gt 0) {
          Write-Host "::error::$resultCount Must-Fix defect(s) found - this driver would FAIL the WHCP Static Tools Logo Test."
          exit 1
        }
        Write-Host "OK: 0 Must-Fix defects."
      shell: pwsh

    - name: Upload SARIF results as build artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: codeql-results
        retention-days: 14
        path: |
          ${{ env.SARIF_MUSTRUN }}
          ${{ env.SARIF_MUSTFIX }}

    # GitHub Code Scanning (upload-sarif) is unavailable on this repository:
    # "Advanced Security is only available for Organizations".
    # SARIF results are already retained as workflow artifacts (codeql-results)
    # and bundled into the driver package under checks/.

    # =====================================================================
    # Everything below only runs if mustfix.qls above passed clean (exit
    # 0) - none of these steps use if: always(), so a Must-Fix defect
    # stops the job right above and none of this - full-solution build,
    # tests, signing, final artifact - ever runs.
    # =====================================================================

    # =====================================================================
    # Full solution build: the driver project is already up to date from
    # the CodeQL pass above (same OutDir/IntDir), so MSBuild's incremental
    # check just confirms it and moves on to protocol/tools/tests, which
    # need the vcpkg plist include/lib dirs discovered earlier. No PREfast
    # flags here - static analysis already ran on the driver above, and
    # PREfast is not meaningful for the plain user-mode protocol/tool/test
    # projects.
    # =====================================================================
    - name: Build full solution (protocol + tool + tests)
      run: |
        msbuild $env:SOLUTION `
          /p:Configuration=$env:CONFIGURATION `
          /p:Platform=$env:PLATFORM `
          /p:WindowsTargetPlatformVersion=10.0.26100.0 `
          /p:VcpkgInstalledDir=$env:VCPKG_INSTALLED_DIR `
          /p:PlistLibName=$env:PLIST_LIB_NAME `
          /nologo /verbosity:minimal /clp:Summary
      shell: pwsh

    # =====================================================================
    # Milestone 2A's own rule ("don't write PASS unless verified") applies
    # here too - a red test run fails the job, it doesn't just get logged.
    # =====================================================================
    - name: Run T2TouchIdTests.exe
      run: |
        $ErrorActionPreference = "Stop"
        $exe = "build\T2TouchIdTests\$env:PLATFORM\$env:CONFIGURATION\T2TouchIdTests.exe"
        if (-not (Test-Path $exe)) {
          Write-Error "Test binary not found: $exe"
          exit 1
        }

        $vcpkgBinDir = Join-Path $env:VCPKG_INSTALLED_DIR "bin"
        if (-not (Test-Path $vcpkgBinDir)) {
          Write-Error "vcpkg bin dir not found: $vcpkgBinDir"
          exit 1
        }
        $env:PATH = "$vcpkgBinDir;$env:PATH"

        & $exe
        if ($LASTEXITCODE -ne 0) {
          Write-Error "T2TouchIdTests.exe reported failures (exit code $LASTEXITCODE)."
          exit 1
        }
        Write-Host "OK: all tests passed."
      shell: pwsh

    # =====================================================================
    # SepVaultGui (Sepvaultgui.csproj): a .NET 8 WPF project, standalone -
    # not part of T2TouchId.sln, built with the .NET SDK directly. Moved
    # here (was Cit2touchidbio.yml's `ci` job) so the one file the INF's
    # [T2SepBootstrap_CopyFiles] actually expects - SepVaultGui.exe - is
    # produced by the same job that packages the driver, instead of a
    # separate path-filtered workflow whose artifact nobody wires in.
    #
    # Two publish flavors, BOTH end up inside a full driver package
    # (driver + coinstaller + T2SepBootstrap + SepVaultGui) later in this
    # job - see "Prepare common driver files (both variants)" below:
    #   - Full (self-contained, single-file): satisfies the INF's
    #     [T2SepBootstrap_CopyFiles] / [SourceDisksFiles] as-is (single exe,
    #     no companion DLLs).
    #   - Min (framework-dependent): needs its companion files
    #     (.dll/.deps.json/.runtimeconfig.json) staged and added to that
    #     copy's INF - handled later by the "Patch Min package INF" step.
    #     Requires the .NET 8 Desktop Runtime on the target machine.
    # =====================================================================
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore SepVaultGui
      run: dotnet restore "$env:GUI_PROJECT"
      shell: pwsh

    - name: Build SepVaultGui
      run: |
        dotnet build "$env:GUI_PROJECT" `
          --no-restore `
          -c $env:CONFIGURATION
      shell: pwsh

    - name: Publish SepVaultGui (self-contained, single-file win-x64)
      run: |
        $ErrorActionPreference = "Stop"
        dotnet publish "$env:GUI_PROJECT" `
          -c $env:CONFIGURATION `
          -r win-x64 `
          --self-contained true `
          -p:PublishSingleFile=true `
          -o artifacts\SepVaultGui-full

        $exePath = "artifacts\SepVaultGui-full\$env:GUI_ASSEMBLY_NAME.exe"
        if (-not (Test-Path $exePath)) {
          Write-Error "Expected published binary not found: $exePath"
          exit 1
        }
        $sizeMb = [Math]::Round((Get-Item $exePath).Length / 1MB, 1)
        Write-Host "OK: published $exePath ($sizeMb MB, self-contained runtime bundled in)"
      shell: pwsh

    # =====================================================================
    # Min build - framework-dependent, NOT self-contained. Requires the
    # target machine to already have the .NET 8 Desktop Runtime installed
    # (https://dotnet.microsoft.com/download/dotnet/8.0 -> ".NET Desktop
    # Runtime"); otherwise it refuses to launch with a "you must install
    # .NET" prompt. Its files get bundled into the Min driver package by
    # the "Prepare common driver files" / "Patch Min package INF" steps
    # below - no standalone GUI-only artifact anymore.
    # =====================================================================
    - name: Publish SepVaultGui (framework-dependent win-x64) - Min
      run: |
        $ErrorActionPreference = "Stop"
        dotnet publish "$env:GUI_PROJECT" `
          -c $env:CONFIGURATION `
          -r win-x64 `
          --self-contained false `
          -o artifacts\SepVaultGui-min

        $exePath = "artifacts\SepVaultGui-min\$env:GUI_ASSEMBLY_NAME.exe"
        if (-not (Test-Path $exePath)) {
          Write-Error "Expected published binary not found: $exePath"
          exit 1
        }
        $sizeMb = [Math]::Round((Get-Item $exePath).Length / 1MB, 1)
        Write-Host "OK: published $exePath ($sizeMb MB, framework-dependent - needs .NET 8 Desktop Runtime on target)"
      shell: pwsh

    # =====================================================================
    # Driver packaging: TWO full packages instead of one, differing only
    # by which SepVaultGui build they carry:
    #   - artifacts\driver-full -> T2TouchId-Signed-Full-<version>
    #   - artifacts\driver-min  -> T2TouchId-Signed-Min-<version>
    # Both get the .sys, the coinstaller, T2SepBootstrap.exe, t2touchid.exe
    # and checks/ - identical in both. The Min package additionally needs
    # SepVaultGui's companion files (.dll/.deps.json/.runtimeconfig.json,
    # framework-dependent build has no single-file merge) staged and added
    # to that copy's INF, which the Full package doesn't need (single-file
    # exe, nothing to add).
    # =====================================================================
    - name: Prepare common driver files (both variants)
      run: |
        $ErrorActionPreference = "Stop"

        $buildOutDir = "$env:DRIVER_DIR\build\$env:DRIVER_NAME\$env:PLATFORM\$env:CONFIGURATION"
        $sysPath     = "$buildOutDir\$env:DRIVER_NAME.sys"
        $infSrcPath  = "$env:DRIVER_DIR\$env:DRIVER_NAME.inf"

        if (-not (Test-Path $sysPath))    { Write-Error "Built .sys not found: $sysPath"; exit 1 }
        if (-not (Test-Path $infSrcPath)) { Write-Error ".inf file not found: $infSrcPath"; exit 1 }

        $coinstallerPath = "build\$env:COINSTALLER_NAME\$env:PLATFORM\$env:CONFIGURATION\$env:COINSTALLER_NAME.dll"
        if (-not (Test-Path $coinstallerPath)) { Write-Error "Built co-installer not found: $coinstallerPath"; exit 1 }

        $bootstrapPath = "build\$env:BOOTSTRAP_PROJECT\$env:PLATFORM\$env:CONFIGURATION\$env:BOOTSTRAP_PROJECT.exe"
        if (-not (Test-Path $bootstrapPath)) { Write-Error "Built bootstrap exe not found: $bootstrapPath"; exit 1 }

        $fullGuiExe = "artifacts\SepVaultGui-full\$env:GUI_ASSEMBLY_NAME.exe"
        if (-not (Test-Path $fullGuiExe)) { Write-Error "Published Full SepVaultGui not found: $fullGuiExe"; exit 1 }

        $minGuiDir = "artifacts\SepVaultGui-min"
        if (-not (Test-Path "$minGuiDir\$env:GUI_ASSEMBLY_NAME.exe")) { Write-Error "Published Min SepVaultGui not found under $minGuiDir"; exit 1 }

        foreach ($variant in @("full", "min")) {
          $packageDir = "artifacts\driver-$variant"
          New-Item -ItemType Directory -Path $packageDir -Force | Out-Null

          Copy-Item -Path $sysPath    -Destination $packageDir -Force
          Copy-Item -Path $infSrcPath -Destination $packageDir -Force

          $pdbPath = "$buildOutDir\$env:DRIVER_NAME.pdb"
          if (Test-Path $pdbPath) { Copy-Item -Path $pdbPath -Destination $packageDir -Force }

          Copy-Item -Path $coinstallerPath -Destination $packageDir -Force

          Copy-Item -Path $bootstrapPath -Destination $packageDir -Force
          $bootstrapPdb = "build\$env:BOOTSTRAP_PROJECT\$env:PLATFORM\$env:CONFIGURATION\$env:BOOTSTRAP_PROJECT.pdb"
          if (Test-Path $bootstrapPdb) { Copy-Item -Path $bootstrapPdb -Destination $packageDir -Force }

          Write-Host "OK: staged common files into $packageDir"
        }

        # Full variant: single self-contained exe, nothing else to add.
        Copy-Item -Path $fullGuiExe -Destination "artifacts\driver-full" -Force

        # Min variant: exe + every companion file dotnet publish produced
        # next to it (.dll, .deps.json, .runtimeconfig.json, optional .pdb) -
        # a framework-dependent build does not run from the .exe alone.
        $minFiles = Get-ChildItem -Path $minGuiDir -File
        if ($minFiles.Count -eq 0) { Write-Error "No published files found under $minGuiDir"; exit 1 }
        foreach ($f in $minFiles) { Copy-Item -Path $f.FullName -Destination "artifacts\driver-min" -Force }
        Write-Host "OK: staged Min SepVaultGui files into artifacts\driver-min:"
        $minFiles | ForEach-Object { Write-Host "  - $($_.Name)" }

        Add-Content -Path $env:GITHUB_ENV -Value "MIN_GUI_FILE_NAMES=$(($minFiles.Name) -join ',')"
      shell: pwsh

    # =====================================================================
    # The Min package's INF needs its SepVaultGui companion files added to
    # [SourceDisksFiles] and [T2SepBootstrap_CopyFiles] - same regex-patch
    # pattern already used in Cit2touchidbio.yml for bundling libplist's
    # runtime DLLs into that driver's INF. The Full package's INF is left
    # untouched (still lists only SepVaultGui.exe, which is all it needs).
    # =====================================================================
    - name: Patch Min package INF with SepVaultGui companion files
      run: |
        $ErrorActionPreference = "Stop"
        $infPath = (Resolve-Path "artifacts\driver-min\$env:DRIVER_NAME.inf").Path

        # Companion files only (SepVaultGui.exe itself is already listed by
        # the INF as shipped) - $env:GUI_ASSEMBLY_NAME.exe stays out of this
        # list so it isn't duplicated.
        $companions = $env:MIN_GUI_FILE_NAMES -split ',' | Where-Object { $_ -ne "$env:GUI_ASSEMBLY_NAME.exe" -and $_ -notmatch '\.pdb$' }
        if ($companions.Count -eq 0) { Write-Error "No SepVaultGui companion files to add to the Min INF."; exit 1 }

        $srcLines  = ($companions | ForEach-Object { "$_ = 1,," }) -join "`r`n"
        $copyLines = ($companions) -join "`r`n"

        $utf8 = New-Object System.Text.UTF8Encoding($false)
        $inf  = [System.IO.File]::ReadAllText($infPath)

        $inf2 = [regex]::Replace($inf, '(?m)^\[SourceDisksFiles\][ \t]*(?=\r?$)', "[SourceDisksFiles]`r`n$srcLines")
        $inf2 = [regex]::Replace($inf2, '(?m)^\[T2SepBootstrap_CopyFiles\][ \t]*(?=\r?$)', "[T2SepBootstrap_CopyFiles]`r`n$copyLines")

        if ($inf2 -eq $inf -or $inf2 -notmatch [regex]::Escape($companions[0])) {
          Write-Error "Min INF was not patched with SepVaultGui companion files."
          exit 1
        }
        [System.IO.File]::WriteAllText($infPath, $inf2, $utf8)

        Write-Host "OK: patched Min INF with companion files:"
        $companions | ForEach-Object { Write-Host "  - $_" }
      shell: pwsh

    - name: Locate StampInf.exe
      run: |
        $ErrorActionPreference = "Stop"
        $roots = @(
          "C:\Program Files (x86)\Windows Kits\10\bin",
          "C:\Program Files\Windows Kits\10\bin"
        )
        $candidates = foreach ($root in $roots) {
          if (Test-Path $root) {
            Get-ChildItem -Path $root -Filter "StampInf.exe" -Recurse -ErrorAction SilentlyContinue
          }
        }
        if (-not $candidates) {
          Write-Error "StampInf.exe was not found on this runner."
          exit 1
        }
        $tool = $candidates | Where-Object { $_.FullName -match '\\x64\\' } | Sort-Object FullName -Descending | Select-Object -First 1
        if (-not $tool) { $tool = $candidates | Sort-Object FullName -Descending | Select-Object -First 1 }
        Write-Host "OK: found StampInf.exe -> $($tool.FullName)"
        Add-Content -Path $env:GITHUB_ENV -Value "STAMPINF_PATH=$($tool.FullName)"
      shell: pwsh

    - name: Stamp both INFs (architecture / date / version / KMDF)
      run: |
        $ErrorActionPreference = "Stop"
        foreach ($variant in @("full", "min")) {
          $infPath = (Resolve-Path "artifacts\driver-$variant\$env:DRIVER_NAME.inf").Path

          # -k 1.15 must match KMDF_VERSION_MAJOR/MINOR in
          # T2TouchIdTransport.vcxproj - same reasoning as the original
          # single-package step (KMDF >= 1.13 has no co-installer fallback).
          & "$env:STAMPINF_PATH" -f "$infPath" -a amd64 -d "$env:DRIVER_DATE" -v "$env:DRIVER_VERSION" -k 1.15
          if ($LASTEXITCODE -ne 0) {
            Write-Error "StampInf failed for $variant (exit $LASTEXITCODE)."
            exit 1
          }
          Write-Host "==> Stamped INF ($variant):"
          Get-Content -Path $infPath | Select-String -Pattern 'DriverVer|PCI\\VEN|KmdfLibraryVersion'
        }
        Write-Host "OK: both INFs stamped."
      shell: pwsh

    - name: Locate Inf2Cat.exe
      run: |
        $ErrorActionPreference = "Stop"
        $roots = @(
          "C:\Program Files (x86)\Windows Kits\10\bin",
          "C:\Program Files\Windows Kits\10\bin"
        )
        $candidates = foreach ($root in $roots) {
          if (Test-Path $root) {
            Get-ChildItem -Path $root -Filter "Inf2Cat.exe" -Recurse -ErrorAction SilentlyContinue
          }
        }
        if (-not $candidates) {
          Write-Error "Inf2Cat.exe was not found on this runner."
          exit 1
        }
        $tool = $candidates | Where-Object { $_.FullName -match '\\x64\\' } | Sort-Object FullName -Descending | Select-Object -First 1
        if (-not $tool) { $tool = $candidates | Sort-Object FullName -Descending | Select-Object -First 1 }
        Write-Host "OK: found Inf2Cat.exe -> $($tool.FullName)"
        Add-Content -Path $env:GITHUB_ENV -Value "INF2CAT_PATH=$($tool.FullName)"
      shell: pwsh

    - name: Generate CAT files (Inf2Cat, both variants)
      run: |
        $ErrorActionPreference = "Stop"
        foreach ($variant in @("full", "min")) {
          $packageDir = (Resolve-Path "artifacts\driver-$variant").Path
          & "$env:INF2CAT_PATH" /driver:"$packageDir" /os:10_X64 /verbose
          if ($LASTEXITCODE -ne 0) { Write-Error "Inf2Cat failed for $variant (exit $LASTEXITCODE)."; exit 1 }
          $catPath = "$packageDir\$env:DRIVER_NAME.cat"
          if (-not (Test-Path $catPath)) { Write-Error "Inf2Cat did not produce $catPath"; exit 1 }
          Write-Host "OK: .cat generated -> $catPath"
        }
      shell: pwsh

    # =====================================================================
    # Signing stays OPTIONAL, matching what T2TouchIdTransport.inf itself
    # says: "PoC-only, not WHQL signed - test-signing / Secure Boot test
    # mode required" (docs/milestone-2-hardware-results.md). A missing
    # CERT/CERT_PWD secret pair means unsigned/test-signable output for
    # BOTH variants, not a broken build.
    # =====================================================================
    - name: Locate signtool.exe
      if: ${{ env.SIGN_CERT_PFX != '' && env.SIGN_CERT_PASSWORD != '' }}
      run: |
        $ErrorActionPreference = "Stop"
        $roots = @(
          "C:\Program Files (x86)\Windows Kits\10\bin",
          "C:\Program Files\Windows Kits\10\bin"
        )
        $candidates = foreach ($root in $roots) {
          if (Test-Path $root) {
            Get-ChildItem -Path $root -Filter "signtool.exe" -Recurse -ErrorAction SilentlyContinue
          }
        }
        if (-not $candidates) {
          Write-Error "signtool.exe was not found on this runner."
          exit 1
        }
        $tool = $candidates | Where-Object { $_.FullName -match '\\x64\\' } | Sort-Object FullName -Descending | Select-Object -First 1
        if (-not $tool) { $tool = $candidates | Sort-Object FullName -Descending | Select-Object -First 1 }
        Write-Host "OK: found signtool.exe -> $($tool.FullName)"
        Add-Content -Path $env:GITHUB_ENV -Value "SIGNTOOL_PATH=$($tool.FullName)"
      shell: pwsh

    - name: Sign .sys and .cat with SignTool (both variants)
      if: ${{ env.SIGN_CERT_PFX != '' && env.SIGN_CERT_PASSWORD != '' }}
      run: |
        $ErrorActionPreference = "Stop"
        $pfxPath = Join-Path $env:TEMP "signcert.pfx"

        try {
          $bytes = [Convert]::FromBase64String($env:SIGN_CERT_PFX)
          [IO.File]::WriteAllBytes($pfxPath, $bytes)

          foreach ($variant in @("full", "min")) {
            $packageDir = "artifacts\driver-$variant"
            $sysPath = "$packageDir\$env:DRIVER_NAME.sys"
            $catPath = "$packageDir\$env:DRIVER_NAME.cat"
            $cerPath = "$packageDir\$env:DRIVER_NAME.cer"

            & "$env:SIGNTOOL_PATH" sign /v /fd SHA256 /f "$pfxPath" /p "$env:SIGN_CERT_PASSWORD" `
              /tr http://timestamp.digicert.com /td SHA256 "$sysPath"
            if ($LASTEXITCODE -ne 0) { Write-Error "Signing .sys failed for $variant (exit $LASTEXITCODE)."; exit 1 }

            & "$env:SIGNTOOL_PATH" sign /v /fd SHA256 /f "$pfxPath" /p "$env:SIGN_CERT_PASSWORD" `
              /tr http://timestamp.digicert.com /td SHA256 "$catPath"
            if ($LASTEXITCODE -ne 0) { Write-Error "Signing .cat failed for $variant (exit $LASTEXITCODE)."; exit 1 }

            $cert = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2(
              $pfxPath, $env:SIGN_CERT_PASSWORD,
              [System.Security.Cryptography.X509Certificates.X509KeyStorageFlags]::Exportable
            )
            Export-Certificate -Cert $cert -FilePath $cerPath | Out-Null
            Write-Host "OK: $variant .sys and .cat signed; .cer exported."
          }
        }
        finally {
          if (Test-Path $pfxPath) { Remove-Item -Path $pfxPath -Force }
        }
      shell: pwsh

    - name: Warn if packaging unsigned
      if: ${{ env.SIGN_CERT_PFX == '' || env.SIGN_CERT_PASSWORD == '' }}
      run: Write-Host "::warning::CERT/CERT_PWD secrets not set - packaging UNSIGNED .sys/.cat in both variants. Target machine needs test-signing enabled or Secure Boot test mode (see docs/milestone-2-hardware-results.md)."
      shell: pwsh

    - name: Stage t2touchid.exe alongside both driver variants
      run: |
        $ErrorActionPreference = "Stop"
        $vcpkgBinDir = Join-Path $env:VCPKG_INSTALLED_DIR "bin"
        if (-not (Test-Path $vcpkgBinDir)) {
          Write-Error "vcpkg bin dir not found: $vcpkgBinDir"
          exit 1
        }
        foreach ($variant in @("full", "min")) {
          $packageDir = "artifacts\driver-$variant"
          Copy-Item -Path "build\t2touchid\$env:PLATFORM\$env:CONFIGURATION\t2touchid.exe" -Destination $packageDir -Force
          Copy-Item -Path (Join-Path $vcpkgBinDir "*.dll") -Destination $packageDir -Force
        }
        Write-Host "OK: staged t2touchid.exe and its runtime DLLs into both variants"
      shell: pwsh

    # =====================================================================
    # "Дані перевірок" go INTO both shipped packages, not just into
    # separate workflow-artifact uploads: mustrun/mustfix SARIF, the
    # PREfast build log, and a short plain-text summary sit in a checks/
    # subfolder next to the driver in each variant.
    # =====================================================================
    - name: Bundle static-analysis results with both packages
      run: |
        $ErrorActionPreference = "Stop"

        function Get-SarifResultCount($path) {
          $sarif = Get-Content -Path $path -Raw | ConvertFrom-Json
          $count = 0
          foreach ($run in $sarif.runs) { if ($run.results) { $count += $run.results.Count } }
          return $count
        }
        $mustrunCount = Get-SarifResultCount $env:SARIF_MUSTRUN
        $mustfixCount = Get-SarifResultCount $env:SARIF_MUSTFIX
        $signed = if ($env:SIGN_CERT_PFX -and $env:SIGN_CERT_PASSWORD) { "yes" } else { "no - test-signing / Secure Boot test mode required on target machine" }

        foreach ($variant in @("full", "min")) {
          $packageDir = "artifacts\driver-$variant"
          $checksDir  = Join-Path $packageDir "checks"
          New-Item -ItemType Directory -Path $checksDir -Force | Out-Null

          Copy-Item -Path $env:SARIF_MUSTRUN -Destination (Join-Path $checksDir "codeql-mustrun.sarif") -Force
          Copy-Item -Path $env:SARIF_MUSTFIX -Destination (Join-Path $checksDir "codeql-mustfix.sarif") -Force
          if (Test-Path (Join-Path $env:BUILD_LOG_DIR "build.log")) {
            Copy-Item -Path (Join-Path $env:BUILD_LOG_DIR "build.log") -Destination (Join-Path $checksDir "prefast-build.log") -Force
          }

          $guiDesc = if ($variant -eq "full") { "SepVaultGui.exe - self-contained, single-file (no .NET runtime needed on target)" } else { "SepVaultGui.exe + companions - framework-dependent (.NET 8 Desktop Runtime required on target)" }

          # String array (one element per line) instead of an @"..."@
          # here-string: the closing "@ is only valid with ZERO leading
          # whitespace, which an indented YAML "run: |" block can't give
          # it - that mismatch is exactly what produced the earlier
          # "White space is not allowed before the string terminator"
          # ParserError. Piping the array to Set-Content writes one line
          # per element (same pattern already used in CiNCM.yml).
          $summary = @(
            "T2TouchIdTransport static-analysis summary ($variant package)",
            "===========================================",
            "Driver:          $env:DRIVER_NAME.sys",
            "Driver version:  $env:DRIVER_VERSION",
            "Built:           $env:DRIVER_DATE (UTC build date; local runner clock)",
            "Target:          PCI\VEN_106B&DEV_1802, KMDF 1.15",
            "SepVaultGui:     $guiDesc",
            "",
            "CodeQL query pack:  microsoft/windows-drivers@$env:CODEQL_DRIVERS_PACK_VERSION",
            "PREfast:            enabled (RunCodeAnalysis + EnableCppCoreCheck, warnings-as-errors)",
            "",
            "mustrun.qls (informational): $mustrunCount finding(s) - see codeql-mustrun.sarif",
            "mustfix.qls (WHCP-blocking): $mustfixCount finding(s) - see codeql-mustfix.sarif",
            "",
            "Tests:  T2TouchIdTests.exe passed (see workflow log for details)",
            "Signed: $signed"
          )
          $summary | Set-Content -Path (Join-Path $checksDir "SUMMARY.txt") -Encoding utf8
        }

        Write-Host "OK: bundled checks/ into both artifacts\driver-full and artifacts\driver-min"
      shell: pwsh

    # =====================================================================
    # Same "staging folder with a named root inside the zip" pattern as
    # before, done twice - one staging dir per variant.
    # =====================================================================
    - name: Prepare final package folders (both variants)
      run: |
        $ErrorActionPreference = "Stop"
        foreach ($variant in @("full", "min")) {
          $tempRoot   = "temp-upload-$variant"
          $stagingDir = Join-Path $tempRoot "T2TouchId"
          New-Item -ItemType Directory -Path $stagingDir -Force | Out-Null
          Copy-Item -Path (Join-Path "artifacts\driver-$variant" "*") -Destination $stagingDir -Recurse -Force
          Write-Host "==> Staged $variant package into $stagingDir :"
          Get-ChildItem -Recurse $stagingDir | ForEach-Object { Write-Host "  - $($_.FullName)" }
        }
        Add-Content -Path $env:GITHUB_ENV -Value "STAGING_DIR_FULL=temp-upload-full"
        Add-Content -Path $env:GITHUB_ENV -Value "STAGING_DIR_MIN=temp-upload-min"
      shell: pwsh

    - name: Upload Full package (driver + bootstrap + coinstaller + Full GUI)
      uses: actions/upload-artifact@v4
      with:
        name: T2TouchId-Signed-Full-${{ env.DRIVER_VERSION }}
        path: ${{ env.STAGING_DIR_FULL }}
        if-no-files-found: error

    - name: Upload Min package (driver + bootstrap + coinstaller + Min GUI)
      uses: actions/upload-artifact@v4
      with:
        name: T2TouchId-Signed-Min-${{ env.DRIVER_VERSION }}
        path: ${{ env.STAGING_DIR_MIN }}
        if-no-files-found: error